<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>크로노아틀라스</title>
    <meta name="description" content="연도 하나를 옮기면 지도·관계 그래프·타임라인이 함께 그 시점으로 바뀌는 역사 지도. 로마제국쇠망사 온톨로지 650객체를 기원전 753년부터 서기 1481년까지." />
    <meta property="og:title" content="크로노아틀라스" />
    <meta property="og:description" content="연도 하나로 지도·관계·타임라인이 같이 움직이는 역사 지도" />
    <meta property="og:type" content="website" />
    <!-- 첫 페인트 전에 테마를 칠한다(FOUC 방지, 자료실과 같은 방식) -->
    <script>try{var t=localStorage.getItem('theme');document.documentElement.dataset.theme=(t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches))?'dark':'light'}catch(e){}</script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
